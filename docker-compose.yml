# Larimar - local development stack
# DEMO ENVIRONMENT ONLY. Not a production deployment topology.
services:
  db:
    image: postgres:16-alpine
    container_name: larimar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: larimar
      POSTGRES_PASSWORD: larimar_dev_password
      POSTGRES_DB: larimar
    ports:
      - "5433:5432"
    volumes:
      - larimar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larimar -d larimar"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: larimar-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://larimar:larimar_dev_password@db:5432/larimar?schema=public
      NODE_ENV: production
    env_file:
      - .env
    ports:
      - "3000:3000"
    profiles: ["full"]

volumes:
  larimar_pgdata:
